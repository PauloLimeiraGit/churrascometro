<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Churrascometro</title>
    <link rel="stylesheet" type="text/css" href="style.css" />

    <link rel="icon" type="img/png" href="/img/espeto2.png" />
  </head>
  <body>
    <main>
      <div class="container">
        <h2>CHURRASCôMETRO</h2>
        <input id="adulto" name="adultos" type="number" placeholder="Adultos" />
        <input
          id="crianca"
          name="crianca"
          type="number"
          placeholder="Crianças"
        />
        <input
          id="duracao"
          name="horas"
          type="number"
          placeholder="Quantas horas"
        />
        <button id="calcular">Calcular</button>

        <div id="resultado"></div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
